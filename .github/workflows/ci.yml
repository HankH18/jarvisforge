name: CI

# SPEC C7: keep CI light — two small jobs, pull_request only, no matrix, no e2e.
#
# CI reachability: this repo now has two git remotes — `github`
# (https://github.com/HankH18/jarvisforge, private) and `gitlab`
# (the actual Gauntlet AI submission target, self-hosted at
# labs.gauntletai.com — see CLAUDE.md). A pull request opened against the
# `github` remote will run this workflow. As of this writing no PR has
# actually been opened, so this workflow is reachable but unproven — it
# has not been observed to execute or pass in GitHub Actions itself, only
# verified by running every step's command locally.
#
# The local gate story changed too: the `cc-factory: harness sync` commit
# deleted `.claude/hooks/verify_gate.sh` along with the hook test scripts
# this workflow used to call, so there is currently no single local
# regression-gate script to point to. See
# docs/HARNESS-BLOCKER-2026-08-14.md for the full detail.
on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lint
        run: cd backend && uv run ruff check src tests

      - name: Test
        run: cd backend && uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run -s lint

      - name: Build
        run: cd frontend && npm run -s build

      - name: Test
        run: cd frontend && npm run -s test -- --run
