name: CI

# SPEC C7: keep CI light — two small jobs, pull_request only, no matrix, no e2e.
#
# CI reachability: this repo now has two git remotes — `github`
# (https://github.com/HankH18/jarvisforge, private) and `gitlab`
# (the actual Gauntlet AI submission target, self-hosted at
# labs.gauntletai.com — see CLAUDE.md). A pull request opened against the
# `github` remote runs this workflow.
#
# PROVEN 2026-08-15. PR #1 was the first pull request this repo ever had.
# Its first run FAILED in 4s: `Unable to resolve action
# astral-sh/setup-uv@v10, unable to find version v10` — that action ships
# releases v10.0.0/v10.0.1 but its moving major tag stops at v7, so the
# backend job could never have run on any commit. The pin had survived
# unnoticed precisely because nothing had ever executed it. Fixed to
# @v10.0.1 (and checkout/setup-node v4 → v5 for the Node-20 deprecation).
# Re-run 31901208728: SUCCESS in 48s, both jobs real — backend
# "503 passed, 13 skipped" + ruff clean, frontend 16 files / 105 tests +
# build.
#
# NOTE the 503+13, not the 516 seen locally: the 13 skipped are the memory
# suite, because CI has no Postgres. T-31's banner says so loudly in the
# log. The DB-required gate is scripts/verify_submission.sh, by design —
# so a green CI here does NOT mean the memory path was verified.
#
# The local gate story changed too: the `cc-factory: harness sync` commit
# deleted `.claude/hooks/verify_gate.sh` along with the hook test scripts
# this workflow used to call, so there is currently no single local
# regression-gate script to point to. See
# docs/HARNESS-BLOCKER-2026-08-14.md for the full detail.
on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lint
        run: cd backend && uv run ruff check src tests

      - name: Test
        run: cd backend && uv run pytest -q

  # Satisfies acceptance #5 of T-20 ("a test script exercises the hook
  # directly ... and runs in CI") and the first half of T-21's #5. Before
  # this job existed, NO workflow referenced anything under scripts/tests/,
  # so all four suites were verify-only: they ran when a ticket closed on
  # someone's laptop and never again.
  #
  # Needs `fetch-depth: 0`. The evidence suite builds sandbox repos and the
  # staleness gate walks history to attribute a stale fingerprint to a
  # commit; a depth-1 checkout makes that attribution silently wrong.
  #
  # run_claim_tests.sh is DELIBERATELY NOT LISTED. It is 36/38, and one of
  # the two failures is a real gap it found: session_claim() in
  # harness_lib.py has no try/except around its json.load, so a CORRUPTED
  # claim record crashes hook-stop with exit 1 and empty stdout, which the
  # Stop-hook contract reads as "do not block" -- a session with a broken
  # claim can stop without finishing. scope's guard() has that try/except;
  # stop's path does not. harness_lib.py is PROTECTED, so no agent can fix
  # it. Add run_claim_tests.sh to this list once that lands; leaving it out
  # is a known, deliberate coverage gap, recorded here rather than silent.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Evidence receipts (T-22/T-34)
        run: bash scripts/tests/run_evidence_tests.sh

      - name: Scope guard (T-20)
        run: bash scripts/tests/run_scope_guard_tests.sh

      - name: verify_submission DB wiring (T-31)
        run: bash scripts/tests/run_require_db_wiring_tests.sh

      - name: smoke_deploy exit codes
        run: bash scripts/tests/run_smoke_exit_code_tests.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run -s lint

      - name: Build
        run: cd frontend && npm run -s build

      - name: Test
        run: cd frontend && npm run -s test -- --run
